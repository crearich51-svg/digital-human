<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录 - 数字人智能讲解员</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "微软雅黑", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 360px;
        }
        h2 { text-align: center; margin-bottom: 30px; color: #333; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #666; font-size: 14px; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color .3s;
        }
        input:focus { outline: none; border-color: #409eff; }
        .btn {
            width: 100%;
            padding: 12px;
            background: #409eff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background .3s;
        }
        .btn:hover { background: #66b1ff; }
        .btn:disabled { background: #999; cursor: not-allowed; }
        .tip { text-align: center; margin-top: 20px; color: #999; font-size: 12px; }
        .error { color: #f56c6c; font-size: 12px; margin-top: 5px; display: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>数字人智能讲解员</h2>
        <div class="form-group">
            <label>用户名</label>
            <input type="text" id="username" placeholder="请输入用户名" value="admin">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="password" placeholder="请输入密码" value="123456">
            <div class="error" id="errorMsg"></div>
        </div>
        <button class="btn" onclick="login()" id="loginBtn">登录</button>
        <div class="tip">测试账号：admin / 123456 或 test / 123456</div>
    </div>

<script>
    const API_BASE = "/api";

    async function login() {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();
        const btn = document.getElementById("loginBtn");
        const errorMsg = document.getElementById("errorMsg");

        if (!username || !password) {
            errorMsg.innerText = "请输入用户名和密码";
            errorMsg.style.display = "block";
            return;
        }

        btn.disabled = true;
        btn.innerText = "登录中...";
        errorMsg.style.display = "none";

        try {
            const res = await fetch(API_BASE + "/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();

            if (data.code === 200) {
                // 保存用户信息
                localStorage.setItem("user", JSON.stringify(data.data));
                // 跳转到首页
                window.location.href = "index.html";
            } else {
                errorMsg.innerText = data.message;
                errorMsg.style.display = "block";
                btn.disabled = false;
                btn.innerText = "登录";
            }
        } catch (e) {
            errorMsg.innerText = "登录失败，请稍后重试";
            errorMsg.style.display = "block";
            btn.disabled = false;
            btn.innerText = "登录";
        }
    }

    // 回车登录
    document.getElementById("password").addEventListener("keypress", function(e) {
        if (e.key === "Enter") login();
    });
</script>
</body>
</html>
