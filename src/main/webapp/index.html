<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>数字人智能讲解员</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; transition: background .3s, color .3s; }
        :root {
            --bg: #f5f7fa;
            --text: #2c3e50;
            --nav: #409eff;
            --card: #fff;
        }
        .dark {
            --bg: #121212;
            --text: #eee;
            --nav: #222;
            --card: #1e1e1e;
        }
        body { font-family: "微软雅黑", sans-serif; background: var(--bg); color: var(--text); }
        nav { background: var(--nav); color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: white; margin: 0 15px; text-decoration: none; }
        .container { width: 900px; margin: 100px auto; text-align: center; }
        h1 { font-size: 36px; margin-bottom: 20px; }
        p { font-size: 18px; color: #888; margin-bottom: 40px; }
        .btn { display: inline-block; padding: 12px 30px; background: #409eff; color: white; text-decoration: none; border-radius: 6px; font-size: 16px; margin: 0 10px; transition: .3s; }
        .btn:hover { background: #66b1ff; }
        #themeBtn { background: transparent; border: 1px solid white; color: white; padding: 5px 12px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
<nav>
    <span>数字人智能讲解员</span>
    <div>
        <a href="index.html">首页</a>
        <a href="create.html">创作</a>
        <a href="works.html">我的作品</a>
        <button id="themeBtn" onclick="toggleTheme()">深色模式</button>
    </div>
</nav>
<div class="container">
    <h1>数字人智能讲解员</h1>
    <p>选主题、选讲解员、写文案、一键生成讲解视频</p>
    <a href="create.html" class="btn">开始创作</a>
    <a href="works.html" class="btn">我的作品</a>
</div>
<script>
    function toggleTheme() {
        document.body.classList.toggle("dark");
        const btn = document.getElementById("themeBtn");
        btn.innerText = document.body.classList.contains("dark") ? "浅色模式" : "深色模式";
    }
</script>
</body>
</html>
